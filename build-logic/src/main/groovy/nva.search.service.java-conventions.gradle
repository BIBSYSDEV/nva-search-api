plugins {
    id 'nva.java-conventions'
}

nva {
    generatedCode = ['org/openarchives/oai/pmh/**']
    errorprone {
        allErrorsAsWarnings = true // TODO: Fix reported issues and set to false
    }
    pmd {
        analyzeTests = false
        excludedRules = [
                'AvoidCatchingGenericException',
                'AvoidPrintStackTrace',
                'AvoidThrowingRawExceptionTypes',
                'ClassNamingConventions',
                'CyclomaticComplexity',
                'FieldNamingConventions',
                'GuardLogStatement',
                'SystemPrintln',
                'VariableCanBeInlined'
        ]
    }
}

dependencies {
    implementation(platform(nvaCatalog.aws.sdk2.bom))
    testImplementation(platform(nvaCatalog.junit.bom))
    testRuntimeOnly(nvaCatalog.junit.jupiter.engine)
    testRuntimeOnly(nvaCatalog.junit.platform.launcher)
}
