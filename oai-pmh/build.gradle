plugins {
    id 'nva.search.service.java-conventions'
    alias(libs.plugins.xjc)
}

xjc {
    useJakarta = true
    markGenerated = true
    defaultPackage.set('org.openarchives.oai.pmh.v2')
    addCompilationDependencies = false
}

// The xjc plugin registers its output directory as a plain path, so tasks reading the
// source set (here: the dependency-analysis plugin) do not inherit a dependency on it.
tasks.configureEach {
    if (name == 'explodeCodeSourceMain') {
        dependsOn(tasks.named('xjc'))
    }
}

dependencies {
    api(libs.jakarta.xml.bind.api)
    compileOnly(libs.jakarta.annotation.api)
}
